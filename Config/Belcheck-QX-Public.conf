[mitm]
# 公开版不携带 CA 口令或证书容器。首次使用请在 Quantumult X 内生成自己的 CA，安装并信任。
skip_validating_cert=true
force_sni_domain_name=false

# hostname 说明：以 - 开头的是排除项；api.weibo.cn 是为 [rewrite_local] 的 VVebo 重写新增的包含项
hostname=api.weibo.cn, -testflight.apple.com, -*.fcbox.com, -*huami.com, -*amemv.com, -*snssdk.com, -www.google.com, -api.weibo.com
